<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AliveID</title>
    <link rel="icon" href="https://play-lh.googleusercontent.com/MLr4HSreG4M-5lzWpjRHUsXp_tDnDbthzhGsWgvd4ant2XDoWbeyCIeOiIBDBj8Chg">
<link rel="icon" type="image/png" sizes="32x32" href="https://play-lh.googleusercontent.com/MLr4HSreG4M-5lzWpjRHUsXp_tDnDbthzhGsWgvd4ant2XDoWbeyCIeOiIBDBj8Chg">
<link rel="icon" type="image/png" sizes="16x16" href="https://play-lh.googleusercontent.com/MLr4HSreG4M-5lzWpjRHUsXp_tDnDbthzhGsWgvd4ant2XDoWbeyCIeOiIBDBj8Chg">
    
    <link rel="stylesheet" href="css.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="content">
        <div id="time">
            
            <div id="valid">
                <svg id="arrow" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left-icon lucide-chevron-left"><path d="m15 18-6-6 6-6"/></svg>
                <svg id="circle" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="lime" class="bi bi-circle-fill" viewBox="0 0 16 16">
                    <circle cx="8" cy="8" r="8"/>
                </svg>
                <p>PLATNÝ</p>
            </div>
            <div id="clock"></div>
        </div>
        <video autoplay loop muted playsinline>
            <source src="ISICCARDFIA.mp4" type="video/mp4">
        </video>
        <div id="bottom">
            <div class="svg">
<svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 30 30" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book-user-icon lucide-book-user"><path d="M15 13a3 3 0 1 0-6 0"/><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/><circle cx="12" cy="8" r="2"/></svg>
            
            </div>
            <div class="svg" id="inactive">
<svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 30 30" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-id-card-icon lucide-id-card"><path d="M16 10h2"/><path d="M16 14h2"/><path d="M6.17 15a3 3 0 0 1 5.66 0"/><circle cx="9" cy="11" r="2"/><rect x="2" y="5" width="20" height="14" rx="2"/></svg>
            
            </div>
            
        </div>
    </div>
    

<script>
    function updateClock() {
        const now = new Date();

        let day = now.getDate().toString().padStart(2, '0');
        let month = (now.getMonth() + 1).toString().padStart(2, '0');
        let year = now.getFullYear();

        let hours = now.getHours().toString().padStart(2, '0');
        let minutes = now.getMinutes().toString().padStart(2, '0');
        let seconds = now.getSeconds().toString().padStart(2, '0');

        document.getElementById("clock").textContent =
            `${day}-${month}-${year} | ${hours}:${minutes}:${seconds}`;
    }

    setInterval(updateClock, 1000);
    updateClock();
</script>
</body>
</html>
